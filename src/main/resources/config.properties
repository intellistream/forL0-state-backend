# Choose algorithm: "elastic" or "heavykeeper"
algorithm=elastic

# Number of heavy hitters to track
topK=100

# Directory containing trace files
traceDir=./src/main/data

# Number of prefix bytes to use as fingerprint
keyLength4=4

# Mask for the highest bit of the fingerprint
highestBitMask=0x80000000

# Number of counters per heavy bucket
counterPerBucket=4

# Threshold for swapping from light to heavy
swapMinValThreshold=5

# ElasticSketch overall memory budget in kilobytes
totalMemoryKb=500

# HeavyKeeper parameters
hkMemoryKb=500
hkDepth=2
hkDecay=1.08

# Stream-Summary parameters
summaryMaxEntries=1000000
summaryChainDepth=1000000
summaryHashSlots=9973
