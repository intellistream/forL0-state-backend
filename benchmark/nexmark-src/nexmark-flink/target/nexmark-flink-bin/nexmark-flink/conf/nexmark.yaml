################################################################################
# NexMark Configuration (auto-generated from benchmark.yaml)
################################################################################

# Metric reporter
nexmark.metric.reporter.host: localhost
nexmark.metric.reporter.port: 9098

# Flink REST
flink.rest.address: localhost
flink.rest.port: 8081

# Metric monitoring settings
# Wait for job to start and produce metrics before monitoring begins
nexmark.metric.monitor.delay: 15s
nexmark.metric.monitor.interval: 1s

# Workload suite - generated from benchmark.yaml
nexmark.workload.suite.benchmark.events.num: 40000000
nexmark.workload.suite.benchmark.tps: 10000000
nexmark.workload.suite.benchmark.queries: "q4, q5, q7, q11, q12, q18, q19"
nexmark.workload.suite.benchmark.warmup.duration: 0s
nexmark.workload.suite.benchmark.warmup.events.num: 0
nexmark.workload.suite.benchmark.warmup.tps: 1000000
