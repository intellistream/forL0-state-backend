  description: ForL0 StateBackend with SwissTable architecture
  config:
    l0_cache_enabled: true
    l0_cache_size: 256mb
    l0_cache_expected_engines: 2
    initial_table_capacity: 2048
    max_table_capacity: 4194304
    main_table_load_factor_threshold: 0.8
    metrics_collector_enabled: false
    workload_overrides:
      nexmark:
        l0_cache_enabled: true
        l0_cache_size: 256mb
        initial_table_capacity: 2048
        max_table_capacity: 4194304
        main_table_load_factor_threshold: 0.8
      wordcount:
        l0_cache_enabled: true
        l0_cache_size: 256mb
        initial_table_capacity: 2048
        max_table_capacity: 4194304
        main_table_load_factor_threshold: 0.8
      client_usecase:
        l0_cache_enabled: true
        l0_cache_size: 256mb
        initial_table_capacity: 2048
        max_table_capacity: 4194304
        main_table_load_factor_threshold: 0.8
    query_overrides:
      q9:
        l0_cache_enabled: false
        initial_table_capacity: 2048
        max_table_capacity: 4194304
      q11:
        l0_cache_enabled: true
        l0_cache_size: 256mb
        initial_table_capacity: 2048
        max_table_capacity: 4194304
      q18:
        l0_cache_enabled: true
        l0_cache_size: 256mb
        initial_table_capacity: 2048
        max_table_capacity: 4194304
output:
  raw_dir: results/raw
  figures_dir: results/figures
  reports_dir: results/reports
  figure_format: pdf
  report_format: markdown
_tuning:
  trial: trial_026_a1d816c8
  parameters:
    initial_table_capacity: 2048
    max_table_capacity: 4194304
    main_table_load_factor_threshold: 0.8
    l0_cache_size: 256mb
    l0_memory_max_size: 768mb
