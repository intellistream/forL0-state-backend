flink:
  home: ${FLINK_HOME}
  rest_url: http://localhost:8081
runtime:
  parallelism: 2
  checkpoint_interval: 0
  nexmark_checkpoint_interval: 10000
  wordcount_checkpoint_interval: 3000
wordcount:
  workload_mode: sliding_window
  num_keys: 1000000
  num_records: 100000000
  arrival_rate: 0
  skew_factor: 1.1
  window_size: 5
  slide_size: 200
  warmup_duration: 0
wordcount_scenarios:
- name: contract_baseline
  description: Sliding-window WordCount (contract rule, window=5s, slide=200ms)
  workload_mode: sliding_window
  num_keys: 1000000
  num_records: 100000000
  skew_factor: 1.1
  arrival_rate: 0
  window_size: 5
  slide_size: 200
  checkpoint_interval: 0
  parallelism: 2
- name: stateful_counter
  description: Stateful counter (ValueState<Long>, 1 read + 1 write per record, Long
    keys)
  workload_mode: stateful_counter
  key_type: long
  num_keys: 2000000
  num_records: 2000000000
  skew_factor: 0
  arrival_rate: 0
  checkpoint_interval: 0
  parallelism: 8
- name: stateful_counter_fastpath
  description: Bounded primitive ValueState counter (2M Long keys, 200M records, ForL0
    fused addAndGet path)
  workload_mode: stateful_counter
  key_type: long
  num_keys: 2000000
  num_records: 200000000
  skew_factor: 0
  arrival_rate: 0
  checkpoint_interval: 0
  parallelism: 8
  repeat_runs: 3
  repeat_policy: best
  forl0_overrides:
    l0_cache_enabled: true
    l0_cache_size: 256mb
    l0_memory_max_size: 768mb
    initial_table_capacity: 2048
    max_table_capacity: 4194304
    main_table_load_factor_threshold: 0.8
- name: stateful_counter_defaultcap_probe
  description: Primitive ValueState counter (2M Long keys, 200M records, backend default
    table capacity)
  workload_mode: stateful_counter
  key_type: long
  num_keys: 2000000
  num_records: 200000000
  skew_factor: 0
  arrival_rate: 0
  checkpoint_interval: 0
  parallelism: 8
  repeat_runs: 3
  repeat_policy: best
- name: stateful_counter_p4_probe
  description: Primitive ValueState counter at p4 (2M Long keys, 200M records, paired
    HashMap/ForL0)
  workload_mode: stateful_counter
  key_type: long
  num_keys: 2000000
  num_records: 200000000
  skew_factor: 0
  arrival_rate: 0
  checkpoint_interval: 0
  parallelism: 4
  repeat_runs: 3
  repeat_policy: median
  forl0_overrides:
    l0_cache_enabled: false
    l0_memory_max_size: 768mb
    initial_table_capacity: 2048
    max_table_capacity: 4194304
    main_table_load_factor_threshold: 0.8
- name: checkpoint_counter
  description: Checkpointed stateful counter (ValueState<Long>, 2M keys, 200M records,
    3s checkpoints)
  workload_mode: stateful_counter
  key_type: long
  num_keys: 2000000
  num_records: 200000000
  skew_factor: 0
  arrival_rate: 0
  checkpoint_interval: 3000
  parallelism: 8
- name: high_cardinality
  description: High-cardinality counter (10M keys, ValueState<Long>, Long keys)
  workload_mode: stateful_counter
  key_type: long
  num_keys: 10000000
  num_records: 2000000000
  skew_factor: 0
  arrival_rate: 0
  checkpoint_interval: 0
  parallelism: 8
  forl0_overrides:
    l0_cache_enabled: true
    l0_cache_size: 256mb
    l0_memory_max_size: 768mb
    initial_table_capacity: 2048
    max_table_capacity: 4194304
    main_table_load_factor_threshold: 0.8
nexmark:
  queries: q4,q5,q8,q9,q11,q18,q19,q20
  q4_events: 80000000
  q5_events: 80000000
  q8_events: 100000000
  q9_events: 40000000
  q11_events: 80000000
  q18_events: 80000000
  q19_events: 80000000
  q20_events: 60000000
  tps: 0
  warmup_events: 0
  warmup_duration: 0
  min_profile_cpu_cores: 0.05
  person_proportion: 1
  auction_proportion: 3
  bid_proportion: 46
nexmark_scenarios:
- name: contract_baseline
  description: 'Contract rule: all stateful queries with checkpointing (10 s interval)'
  queries: q4,q5,q8,q9,q11,q18,q19,q20
  checkpoint_interval: 10000
- name: contract_baseline_gc_guard
  description: 'Contract rule with Full-GC guard: accept samples only when Full GC
    delta is at most 5'
  queries: q4,q5,q8,q9,q11,q18,q19,q20
  checkpoint_interval: 10000
  reject_full_gc: true
  max_full_gc_delta: 5
  max_attempts_per_query: 2
  timeout_seconds: 21600
- name: forl0_optimized
  description: 'ForL0-tuned: higher event volume, no checkpoint, larger L0 cache'
  queries: q4,q5,q8,q9,q11,q18,q19,q20
  checkpoint_interval: 0
  event_multiplier: 2
  forl0_overrides:
    l0_cache_size: 256mb
    initial_table_capacity: 2048
    max_table_capacity: 4194304
- name: forl0_q5_tps_probe
  description: 'Non-contract probe: NexMark q5 steady-state TPS mode with sink backpressure'
  queries: q5
  checkpoint_interval: 0
  runtime_overrides:
    parallelism: 4
  person_proportion: 1
  auction_proportion: 49
  bid_proportion: 50
  tps: 50000000
  metric_tps_vertex: sink
  metric_monitor_delay: 10s
  metric_monitor_interval: 5s
  metric_monitor_duration: 60s
  warmup_duration: 0
  repeat_per_query: 1
  min_success_samples: 1
  max_attempts_per_query: 1
  min_cpu_cores: 0.0
  min_profile_cpu_cores: 0.0
  timeout_seconds: 21600
  query_events:
    q5: 0
  flink_config_overrides:
    parallelism.default: 4
    taskmanager.numberOfTaskSlots: 4
    table.exec.mini-batch.enabled: false
    table.optimizer.distinct-agg.split.enabled: false
    execution.checkpointing.checkpoints-after-tasks-finish.enabled: false
    pipeline.object-reuse: true
  forl0_overrides:
    l0_cache_enabled: true
    l0_cache_size: 256mb
    l0_memory_max_size: 768mb
    initial_table_capacity: 2048
    max_table_capacity: 4194304
    main_table_load_factor_threshold: 0.8
