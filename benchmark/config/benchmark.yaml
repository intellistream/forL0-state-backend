# ForL0 StateBackend Benchmark Configuration

# Flink cluster settings
flink:
  # Flink home directory (set via environment variable or override here)
  home: ${FLINK_HOME}
  # REST API endpoint
  rest_url: "http://localhost:8081"

# Benchmark runtime settings
runtime:
  parallelism: 8              # Task parallelism
  checkpoint_interval: 0      # ms (0 = disabled)
  
# WordCount benchmark settings
# Uses KeyedProcessFunction + ValueState (VoidNamespace) for pure state access testing
# No window/timer overhead - maximizes state backend impact on performance
wordcount:
  num_keys: 2000000           # Number of unique keys (high cardinality for SwissTable)
  num_records: 2000000000     # Total number of records
  arrival_rate: 0             # 0 = unlimited (full speed for max throughput)
  skew_factor: 0              # Zipf s parameter (0 = uniform distribution)
  warmup_duration: 0         # warmup duration in seconds (0 to disable)


# NexMark benchmark settings
nexmark:
  # NexMark queries to run (all stateful queries for full benchmark)
  queries: "q4,q5,q7,q8,q9,q11,q12,q18,q19,q20"
  # Data volume per query (as specified in test plan)
  q4_events: 160000000         # 8000万
  q5_events: 160000000         # 8000万
  q7_events: 160000000         # 8000万
  q8_events: 200000000        # 1亿
  q9_events: 80000000         # 4000万
  q11_events: 160000000        # 8000万
  q12_events: 160000000        # 8000万
  q18_events: 160000000        # 8000万
  q19_events: 160000000        # 8000万
  q20_events: 80000000        # 6000万
  tps: 0                      # events per second (0 = unlimited)
  warmup_events: 0     # warmup events
  warmup_duration: 0         # warmup duration in seconds
  # Event proportions (Nexmark default: Person:Auction:Bid = 1:3:46)
  person_proportion: 1
  auction_proportion: 3
  bid_proportion: 46

# Unit test benchmark settings
unittest:
  num_keys: 10000000             # Number of unique keys
  state_size: 32              # State value size in bytes
  num_operations: 1000000000   # Total number of operations
  zipf_exponent: 0          # 0 = uniform, >0 = Zipf distribution
  arrival_rate: 0             # ops/sec, 0 = unlimited

# Client usecase benchmark settings
client_usecase:
  num_records: 5000         # Desired total input records across both sources for the whole job
  timeout_seconds: 7200      # Client usecase is heavy; allow up to 2h before treating as timeout

# Benchmark Set v4 - High state pressure realistic business scenarios
# All benchmarks use Long keys to trigger SwissTableLong specialization
# Design principles:
#   - 5-10 states per operator (vs 1 in WordCount)
#   - 15-25 state ops per record (vs 2 in WordCount)
#   - Ring buffer pattern (MapState) to avoid ListState serialization noise
#   - Primitive types, no temporary object allocation in hot path
#   - Throughput = numRecords / time (blackhole sink)
benchset:
  # Fraud Detection Engine - Real-time transaction risk assessment
  # States: 7 (5 ValueState + 2 MapState)
  # Ops/record: 23 (7 read + 6 write + 10 map ops)
  # Advantage: valueUpdate (+60%), mapGet/Put (+90%)
  fraud:
    num_keys: 5000000           # Number of users (high cardinality)
    num_records: 800000000      # 3亿 transactions
    skew_factor: 0              # 0 = uniform distribution
  
  # Realtime Recommendation Engine - User interest profile tracking
  # States: 6 (3 ValueState + 3 MapState)
  # Ops/record: 18 (3 read + 3 write + 12 map ops)
  # Advantage: MapState-dominant workload (+90-110%)
  recommend:
    num_keys: 5000000           # Number of users
    num_records: 800000000      # 3亿 events
    skew_factor: 0              # 0 = uniform distribution
  
  # Multi-Metric Aggregation - Pure ValueState stress test
  # States: 10 (all ValueState)
  # Ops/record: 20 (10 read + 10 write)
  # Advantage: Pure valueUpdate (+60-87%), isolates ValueState performance
  metric:
    num_keys: 1000000           # Number of service instances
    num_records: 800000000      # 3亿 metrics
    skew_factor: 0              # 0 = uniform distribution
  
  # Session Sequence Analysis - Ring buffer pattern
  # States: 5 (3 ValueState + 2 MapState with ring buffer)
  # Ops/record: 15 (8 read + 7 write)
  # Advantage: Ring buffer via MapState (+74-110%)
  session:
    num_keys: 5000000           # Number of sessions
    num_records: 800000000      # 8亿 events
    skew_factor: 0              # 0 = uniform distribution
    batch_size: 100             # Ring buffer size
  
  # Multi-Stream Join - Order/Payment/Shipment correlation
  # States: 8 (3 ValueState + 5 MapState)
  # Ops/record: 25 (15 read + 10 write)
  # Advantage: Scan-based matching, highest state density (+90-131%)
  join:
    num_keys: 1000000           # Number of users (not orderId!)
    num_records: 500000000      # 8亿 events (40% order, 40% payment, 20% shipment)
    skew_factor: 0              # 0 = uniform distribution

# State backends to compare
backends:
  - name: hashmap
    class: org.apache.flink.runtime.state.hashmap.HashMapStateBackendFactory
    description: "Flink native HashMapStateBackend (baseline)"
  
  - name: forl0
    class: org.apache.flink.state.forl0.ForL0StateBackendFactory
    description: "ForL0 StateBackend with SwissTable architecture"

# Metrics collection settings
metrics:
  # Reserved for future metrics options
  enabled: true

# Output settings
output:
  # Directory for raw results (relative to benchmark/)
  raw_dir: "results/raw"
  # Directory for figures (relative to benchmark/)
  figures_dir: "results/figures"
  # Directory for reports (relative to benchmark/)
  reports_dir: "results/reports"
  # Figure format
  figure_format: "pdf"  # pdf for papers, png for preview
  # Report format
  report_format: "markdown"  # markdown or html
