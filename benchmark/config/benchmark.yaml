# ForL0 StateBackend Benchmark Configuration

# Run mode: local (Mac development) or cluster (production server)
mode: cluster

# Flink cluster settings
flink:
  # Flink home directory (set via environment variable or override here)
  home: ${FLINK_HOME}
  # REST API endpoint
  rest_url: "http://localhost:8081"

# Local mode settings (for development/testing on Mac)
local:
  parallelism: 4
  checkpoint_interval: 0  # 0 = disabled, or set to 10000 for 10s
  
  wordcount:
    num_keys: 1000000         # 500万 key (增加状态规模)
    num_records: 20000000     # 2000万条 (确保作业运行足够长时间 > 20秒)
    arrival_rate: 0           # 无限制，全速运行 (消除限流开销)
    skew_factor: 1.1          # Zipf s parameter 
    window_size: 5000         # milliseconds
    slide_size: 200           # milliseconds
    warmup_duration: 30       # warmup duration in seconds (0 to disable)
  
  nexmark:
    # NexMark queries to run (stateful queries with window/aggregation)
    queries: "q4,q5,q7,q8"    # 本地测试4个状态密集型查询
    events: 50000000          
    tps: 100000000              # events per second (local mode)
    warmup_events: 1000000     # warmup events
    warmup_duration: 10        # warmup duration in seconds
  
  unittest:
    num_keys: 1000            # Number of unique keys
    state_size: 100           # State value size in bytes
    num_operations: 1000000   # Total number of operations
    zipf_exponent: 0          # 0 = uniform, >0 = Zipf distribution
    arrival_rate: 0           # ops/sec, 0 = unlimited

# Cluster mode settings (for production server)
cluster:
  parallelism: 4              # 2 TM x 4 slots
  checkpoint_interval: 0  # ms (10s)
  
  wordcount:
    num_keys: 1000000         # 100万 key
    num_records: 1000000000    # 10亿条
    arrival_rate: 0 
    skew_factor: 1.0         # Zipf s parameter
    window_size: 5000         # milliseconds (10s)
    slide_size: 5000          # milliseconds (10s)
    warmup_duration: 20       # warmup duration in seconds (0 to disable)
  
  nexmark:
    # NexMark queries to run (all stateful queries for full benchmark)
    queries: "q4,q5,q7,q8,q9,q11,q12,q18,q19,q20"
    # Data volume per query (as specified in test plan)
    q4_events: 20000000       # 8000万
    q5_events: 20000000       # 8000万
    q7_events: 20000000       # 8000万
    q8_events: 300000000      # 1亿
    q9_events: 10000000       # 4000万
    q11_events: 20000000      # 8000万
    q12_events: 20000000      # 8000万
    q18_events: 20000000      # 8000万
    q19_events: 20000000      # 8000万
    q20_events: 20000000      # 6000万
    tps: 1000000             # events per second (cluster mode)
    warmup_events: 10000000   # warmup events
    warmup_duration: 10      # warmup duration in seconds
  
  unittest:
    num_keys: 10000           # Number of unique keys
    state_size: 32           # State value size in bytes
    num_operations: 500000000  # Total number of operations
    zipf_exponent: 1.0       # 0 = uniform, >0 = Zipf distribution
    arrival_rate: 0           # ops/sec, 0 = unlimited

# State backends to compare
backends:
  - name: hashmap
    class: org.apache.flink.runtime.state.hashmap.HashMapStateBackendFactory
    description: "Flink native HashMapStateBackend (baseline)"
  
  - name: forl0
    class: org.apache.flink.runtime.state.heap.ForL0StateBackendFactory
    description: "ForL0 StateBackend with SwissMap architecture"

# Metrics collection settings
metrics:
  # Reserved for future metrics options
  enabled: true

# Output settings
output:
  # Directory for raw results (relative to benchmark/)
  raw_dir: "results/raw"
  # Directory for figures (relative to benchmark/)
  figures_dir: "results/figures"
  # Directory for reports (relative to benchmark/)
  reports_dir: "results/reports"
  # Figure format
  figure_format: "pdf"  # pdf for papers, png for preview
  # Report format
  report_format: "markdown"  # markdown or html
