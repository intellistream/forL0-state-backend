benchset:
  fd:
    num_keys: 40000
    num_records: 2000000
    skew_factor: 0.22        # wider customer working set while preserving enough temporal reuse for hot inner-map updates
    batch_size: 24           # slightly longer bursts to amortize job overhead and amplify state reuse

  sd:
    num_keys: 40000
    num_records: 2000000
    skew_factor: 0.18        # enough burst reuse for stable hot-map alert windows without collapsing to tiny hot loops
    batch_size: 24           # retain bursts while increasing repeated slot updates in sensor/alert stages

  tm:
    num_keys: 40000
    num_records: 1000000
    skew_factor: 0.16        # revisit segment-local indexes often enough for map fast path to matter
    batch_size: 16           # retain burstiness without collapsing to a tiny hot set

  lg:
    num_keys: 30000
    num_records: 1200000
    skew_factor: 0.24        # larger actor set so backend cost dominates more than tiny-heap hot loops
    batch_size: 28           # slightly longer bursts to repeatedly touch existing map entries per outer key

  vs:
    num_keys: 30000
    num_records: 600000
    skew_factor: 0.28        # wider caller/callee working set while keeping branch-local maps warm
    batch_size: 24           # longer bursts keep branch-local map slots populated and repeatedly updated

  lr:
    num_keys: 50000
    num_records: 1000000
    skew_factor: 0.18        # repeated segment/account updates make reduce + map pressure visible
    batch_size: 16           # avoid over-reusing a tiny local road segment set

# State backends to compare
backends:
  - name: hashmap
    class: org.apache.flink.runtime.state.hashmap.HashMapStateBackendFactory
    description: "Flink native HashMapStateBackend (baseline)"
  
  - name: forl0
    class: org.apache.flink.state.forl0.ForL0StateBackendFactory
    description: "ForL0 StateBackend with SwissTable architecture"
    config:
      l0_cache_enabled: true
      l0_cache_size: 64mb
      initial_table_capacity: 256
      max_table_capacity: 4096
      main_table_load_factor_threshold: 0.75
      metrics_collector_enabled: false
      workload_overrides:
        nexmark:
          l0_cache_enabled: true
          l0_cache_size: 64mb
          initial_table_capacity: 256
          max_table_capacity: 4096
          main_table_load_factor_threshold: 0.75
        wordcount:
          l0_cache_enabled: true
          l0_cache_size: 96mb
          initial_table_capacity: 512
          max_table_capacity: 4096
          main_table_load_factor_threshold: 0.80
        client_usecase:
          l0_cache_enabled: true
          l0_cache_size: 128mb
          initial_table_capacity: 512
          max_table_capacity: 8192
          main_table_load_factor_threshold: 0.80
      # Query-specific tuning: keep contract workload unchanged while adapting backend internals.
      query_overrides:
        q9:
          l0_cache_enabled: false
          initial_table_capacity: 64
          max_table_capacity: 1024
        q11:
          l0_cache_enabled: true
          l0_cache_size: 64mb
          initial_table_capacity: 256
          max_table_capacity: 4096
        q18:
          l0_cache_enabled: true
          l0_cache_size: 64mb
          initial_table_capacity: 256
          max_table_capacity: 4096

# Output settings
output:
  # Directory for raw results (relative to benchmark/)
  raw_dir: "results/raw"
  # Directory for figures (relative to benchmark/)
  figures_dir: "results/figures"
  # Directory for reports (relative to benchmark/)
  reports_dir: "results/reports"
  # Figure format
  figure_format: "pdf"  # pdf for papers, png for preview
  # Report format
  report_format: "markdown"  # markdown or html
