# ForL0 StateBackend Benchmark Configuration

# Flink cluster settings
flink:
  # Flink home directory (set via environment variable or override here)
  home: ${FLINK_HOME}
  # REST API endpoint
  rest_url: "http://localhost:8081"

# Benchmark runtime settings
runtime:
  parallelism: 4              # Task parallelism
  checkpoint_interval: 0      # ms (0 = disabled)
  
# WordCount benchmark settings
# Uses KeyedProcessFunction + ValueState (VoidNamespace) for pure state access testing
# No window/timer overhead - maximizes state backend impact on performance
wordcount:
  num_keys: 1000000           # Number of unique keys (high cardinality for SwissTable)
  num_records: 1500000000     # Total number of records
  arrival_rate: 0             # 0 = unlimited (full speed for max throughput)
  skew_factor: 0              # Zipf s parameter (0 = uniform distribution)
  warmup_duration: 20         # warmup duration in seconds (0 to disable)

# Benchmark Set - Realistic business scenarios for ForL0 StateBackend
# All benchmarks use Long keys to trigger SwissTableLong specialization
# Design principle: All ValueState (ForL0's sweet spot), high cardinality, uniform distribution
benchset:
  # Real-time Session Analytics: Track session metrics in real-time
  # Business: Web/App analytics, each session has multiple metrics
  # Pattern: 50M sessions, 3 ValueStates, 6 ops/record, ~85% NEW ratio
  adclick:
    num_keys: 50000000        # 50M unique sessions (very high cardinality)
    num_records: 1000000000   # 1B events
    skew_factor: 0            # Uniform (maximize NEW ratio)
    arrival_rate: 0           # Unlimited throughput
  
  # Real-time Fraud Detection: Multi-feature risk scoring
  # Business: Credit card fraud detection, each transaction checks multiple risk indicators
  # Pattern: 30M transactions, 5 ValueStates, 10 ops/record, ~80% NEW ratio
  userprofile:
    num_keys: 30000000        # 30M unique transaction IDs
    num_records: 1000000000   # 1B transactions
    skew_factor: 0            # Uniform (each transaction mostly unique)
    arrival_rate: 0           # Unlimited throughput
  
  # High-cardinality Event Deduplication: Exactly-once message processing
  # Business: Message dedup for exactly-once semantics (Kafka/Pulsar)
  # Pattern: 50M message IDs, 2 ValueStates, 4 ops/record, ~90% NEW ratio
  iot:
    num_keys: 50000000        # 50M unique message IDs
    num_records: 1000000000   # 1B messages
    skew_factor: 0            # Uniform (each message is unique)
    arrival_rate: 0           # Unlimited throughput
  
  # Stream-Stream Join: Order-Payment matching with high cardinality
  # Business: E-commerce order-payment reconciliation
  # Pattern: 60M join keys, 2 ValueStates, 3 ops/record, ~90% NEW ratio
  order:
    num_keys: 60000000        # 60M unique order IDs
    num_records: 1000000000   # 1B join probes
    skew_factor: 0            # Uniform (each order appears 1-2 times)
    arrival_rate: 0           # Unlimited throughput
    skew_factor: 1.0          # Slightly skewed (some users more active)
    arrival_rate: 0           # Unlimited throughput
  
  # IoT Device Metrics: Multi-metric aggregation (count, sum, min, max)
  # Business: Industrial IoT, smart city monitoring
  iot:
    num_keys: 5000000         # 5M devices
    num_records: 500000000    # 500M sensor readings
    skew_factor: 0.8          # Slightly skewed (some devices report more)
    arrival_rate: 0           # Unlimited throughput
  
  # Order Status Tracking: State transitions, high cardinality
  # Business: E-commerce order tracking, logistics
  order:
    num_keys: 10000000        # 10M orders
    num_records: 500000000    # 500M status updates
    skew_factor: 0            # Uniform (orders are independent)
    arrival_rate: 0           # Unlimited throughput

# NexMark benchmark settings
nexmark:
  # NexMark queries to run (all stateful queries for full benchmark)
  queries: "q4,q5,q7,q8,q9,q11,q12,q18,q19,q20"
  # Data volume per query (as specified in test plan)
  q4_events: 160000000         # 8000万
  q5_events: 160000000         # 8000万
  q7_events: 160000000         # 8000万
  q8_events: 200000000        # 1亿
  q9_events: 80000000         # 4000万
  q11_events: 160000000        # 8000万
  q12_events: 160000000        # 8000万
  q18_events: 160000000        # 8000万
  q19_events: 160000000        # 8000万
  q20_events: 80000000        # 6000万
  tps: 0                      # events per second (0 = unlimited)
  warmup_events: 0     # warmup events
  warmup_duration: 0         # warmup duration in seconds
  # Event proportions (Nexmark default: Person:Auction:Bid = 1:3:46)
  person_proportion: 1
  auction_proportion: 3
  bid_proportion: 46

# Unit test benchmark settings
unittest:
  num_keys: 10000000             # Number of unique keys
  state_size: 64              # State value size in bytes
  num_operations: 1000000000   # Total number of operations
  zipf_exponent: 0          # 0 = uniform, >0 = Zipf distribution
  arrival_rate: 0             # ops/sec, 0 = unlimited

# State backends to compare
backends:
  - name: hashmap
    class: org.apache.flink.runtime.state.hashmap.HashMapStateBackendFactory
    description: "Flink native HashMapStateBackend (baseline)"
  
  - name: forl0
    class: org.apache.flink.state.forl0.ForL0StateBackendFactory
    description: "ForL0 StateBackend with SwissTable architecture"

# Metrics collection settings
metrics:
  # Reserved for future metrics options
  enabled: true

# Output settings
output:
  # Directory for raw results (relative to benchmark/)
  raw_dir: "results/raw"
  # Directory for figures (relative to benchmark/)
  figures_dir: "results/figures"
  # Directory for reports (relative to benchmark/)
  reports_dir: "results/reports"
  # Figure format
  figure_format: "pdf"  # pdf for papers, png for preview
  # Report format
  report_format: "markdown"  # markdown or html
